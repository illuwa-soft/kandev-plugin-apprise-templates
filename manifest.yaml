id: kandev-plugin-apprise-templates
api_version: 2
version: "0.1.0"
display_name: Apprise Templates
description: Owned per-event notification templates, immutable configuration, and synthetic previews. Delivery and credentials stay in Kandev.
author: yontani
repo_url: https://github.com/illuwa-soft/kandev-plugin-apprise-templates
categories: [connector]
# Development candidate only: the released SDK-wide floor is 0.99.0, but this
# package also requires the unreleased notification formatter extension.
# The notification_provider scope makes unchanged old hosts reject the package.
min_kandev_version: "0.99.0"
notification_formatters:
  - key: apprise-text
    contract_version: 1
    provider_types: [apprise]
    management_actions: [templates.catalog, templates.get, templates.prepare, templates.import, templates.export]
actions:
  - {key: templates.catalog, scope: notification_provider, max_body_bytes: 131072}
  - {key: templates.get, scope: notification_provider, max_body_bytes: 131072}
  - {key: templates.prepare, scope: notification_provider, max_body_bytes: 131072}
  - {key: templates.import, scope: notification_provider, max_body_bytes: 131072}
  - {key: templates.export, scope: notification_provider, max_body_bytes: 131072}
runtime:
  type: binary
  executables:
    linux-amd64: server/plugin-linux-amd64
    linux-arm64: server/plugin-linux-arm64
    darwin-amd64: server/plugin-darwin-amd64
    darwin-arm64: server/plugin-darwin-arm64
    windows-amd64: server/plugin-windows-amd64.exe
ui:
  bundle: /ui/bundle.js
